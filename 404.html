<!DOCTYPE html>
<html>
  <head>
    <link rel="icon" href="/G.png" />
    <script
      defer
      data-domain="sz-games.github.io"
      src="https://stats.senty.com.au/js/script.outbound-links.pageview-props.tagged-events.js"
    ></script>
    <script>
      window.plausible =
        window.plausible ||
        function () {
          ;(window.plausible.q = window.plausible.q || []).push(arguments)
        }
    </script>
    <title>Sz Games | 404</title>
<meta name="robots" content="noindex, follow" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        background: rgb(41, 41, 41);
        margin: 0;
        color: white;
        font-family: Arial, Helvetica, sans-serif;
        min-height: 100vh;
      }

      .game-covers {
        position: fixed;
        width: 100%;
        height: 100%;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
        padding: 20px;
        opacity: 0.2;
      }

      .cover {
        aspect-ratio: 1;
        background-size: cover;
        background-position: center;
        border-radius: 10px;
        transform: rotate(var(--rotation));
        animation: float 6s ease-in-out infinite;
      }

      @keyframes float {
        0%,
        100% {
          transform: rotate(var(--rotation)) translateY(0);
        }
        50% {
          transform: rotate(var(--rotation)) translateY(-20px);
        }
      }

      .error-container {
        position: relative;
        box-sizing: border-box;
        width: min(680px, calc(100% - 24px));
        margin: 24px auto;
        text-align: center;
        background: rgba(32, 32, 32, 0.9);
        padding: 40px;
        border-radius: 20px;
        border: 2px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        z-index: 2;
      }

      .logo {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-bottom: 20px;
      }

      .logo img {
        width: 50px;
        height: 50px;
      }

      .error-code {
        font-size: 96px;
        line-height: 1.1;
        font-weight: bold;
        margin: 0;
        background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .error-message {
        font-size: 24px;
        margin: 20px 0;
      }

      .home-link {
        display: inline-block;
        padding: 15px 35px;
        background: linear-gradient(45deg, #ff3d3d, #ff8c00);
        color: white;
        text-decoration: none;
        border-radius: 25px;
        font-weight: bold;
        font-size: 18px;
        letter-spacing: 1px;
        text-transform: uppercase;
        box-shadow: 0 4px 15px rgba(255, 61, 61, 0.4);
        position: relative;
        overflow: hidden;
        animation: pulse 2s infinite;
      }

      .home-link:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 25px rgba(255, 61, 61, 0.6);
        background: linear-gradient(45deg, #ff8c00, #ff3d3d);
      }

      .home-link:active {
        transform: translateY(0);
        box-shadow: 0 2px 10px rgba(255, 61, 61, 0.4);
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
        100% {
          transform: scale(1);
        }
      }

      .home-link::after {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
        transform: rotate(45deg);
        animation: shine 3s infinite;
      }

      @keyframes shine {
        0% {
          transform: translateX(-100%) rotate(45deg);
        }
        100% {
          transform: translateX(100%) rotate(45deg);
        }
      }

      .play-box {
        position: relative;
        width: 100%;
        aspect-ratio: 3 / 1;
        margin: 20px 0;
        border-radius: 12px;
        overflow: hidden;
        background: #111 center / cover no-repeat url('/cover/dino.webp');
      }

      .play-box iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }

      .play-btn {
        position: absolute;
        inset: 0;
        width: 100%;
        border: 0;
        cursor: pointer;
        color: white;
        font-size: 20px;
        font-weight: bold;
        background: rgba(0, 0, 0, 0.55);
      }

      .play-btn:hover,
      .play-btn:focus-visible {
        background: rgba(0, 0, 0, 0.35);
      }

      .popular {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
        gap: 10px;
        margin: 22px 0;
      }

      .popular a {
        color: white;
        text-decoration: none;
        font-size: 14px;
      }

      .popular img {
        display: block;
        width: 100%;
        aspect-ratio: 1;
        object-fit: cover;
        border-radius: 8px;
        margin-bottom: 4px;
        background: #111;
      }

      .popular a:hover img {
        outline: 2px solid #4ecdc4;
      }

      @media (max-width: 520px) {
        .error-container {
          padding: 20px;
        }
        .error-code {
          font-size: 64px;
        }
      }
    </style>
  </head>
  <body>

      <a href="https://sz-games.github.io" class="home-link">🎮 Back to Games 🎮</a>

        <a href="https://sz-games.github.io/games/game.html?game=https://sz-games.github.io/slope/"><img src="/cover/slope.webp" alt="" width="110" height="110" loading="lazy" />Slope</a>
        <a href="https://sz-games.github.io/games/game.html?game=https://sz-games.github.io/Games9/bitlife"><img src="/cover/Bitlife.webp" alt="" width="110" height="110" loading="lazy" />Bitlife</a>
        <a href="https://sz-games.github.io/games/game.html?game=https://sz-games.github.io/storage3/AWeb/"><img src="/cover/Minecraft.webp" alt="" width="110" height="110" loading="lazy" />Minecraft</a>
        <a href="https://sz-games.github.io/games/game.html?game=/Games11/retro-bowl/game"><img src="/cover/retrobowl.avif" alt="" width="110" height="110" loading="lazy" />Retro Bowl</a>
      </div>
      <script>
        document.getElementById('play').addEventListener('click', function () {
          var f = document.createElement('iframe')
          f.src = '/games/dino/'
          f.title = 'Chrome Dino'
          this.parentNode.replaceChild(f, this)
          f.focus()
        })
      </script>
    </div>
  </body>
</html>
