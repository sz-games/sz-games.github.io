<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 415 417" width="415" height="417" role="img" aria-label="Sz Games logo">
  <style>
    .cup-l { animation: lookL 7s ease-in-out infinite; }
    .cup-r { animation: lookR 7s ease-in-out infinite; }
    @keyframes lookL {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(6px, 4px); }
      50% { transform: translate(-5px, 5px); }
      75% { transform: translate(-3px, -4px); }
    }
    @keyframes lookR {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(5px, 4px); }
      50% { transform: translate(-4px, 5px); }
      75% { transform: translate(-2px, -4px); }
    }
    .blink {
      transform-box: fill-box;
      transform-origin: center;
      animation: blink 5.2s infinite;
    }
    @keyframes blink {
      0%, 92%, 100% { transform: scaleY(1); }
      94.5% { transform: scaleY(0.07); }
      97% { transform: scaleY(1); }
    }
  </style>
